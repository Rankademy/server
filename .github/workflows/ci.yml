name: CI - Build & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃 🪜
        uses: actions/checkout@v4

      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: CI용 .env 생성
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is not set" >&2
            exit 1
          fi
          printf '%s' "$ENV_FILE" > .env

      - name: gradlew 권한 부여
        run: chmod +x gradlew

      - name: 애플리케이션 빌드 & 테스트
        run: ./gradlew build

      - name: 프로젝트 버전 추출
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          if [ -z "$VERSION" ]; then
            echo "Gradle project version could not be determined" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인 🌊
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 도커 이미지 배포 🐳
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./publish_docker_with_args.sh "${VERSION}"
