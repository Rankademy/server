name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI - Build & Publish"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: 배포
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 셋업 (버전 재계산용)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: 배포용 .env 생성
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is not set" >&2
            exit 1
          fi
          printf '%s' "$ENV_FILE" > .env

      - name: Gradle 버전 재계산
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          if [ -z "$VERSION" ]; then
            echo "Gradle project version could not be determined" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 배포 파일 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: .env,docker-compose.yml
          target: /home/${{ secrets.EC2_USER }}/app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            VERSION="${{ steps.meta.outputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "Image version was not provided" >&2
              exit 1
            fi
            export APP_VERSION="$VERSION"
            cd "/home/${USER}/app"
            docker rm -f rankademy-app
            docker compose pull
            docker compose up -d --no-deps --build app
