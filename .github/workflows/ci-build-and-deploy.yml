name: ci-build-and-deploy

on:
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    continue-on-error: false
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: release 리포지토리 체크아웃 🪜
        uses: actions/checkout@v4

      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: gradlew 권한 부여
        run: chmod +x gradlew

      - name: 애플리케이션 빌드 & 테스트
        run: ./gradlew build

      - name: 프로젝트 버전 추출
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          if [ -z "$VERSION" ]; then
            echo "Gradle project version could not be determined" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인 🌊
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 도커 이미지 배포 🐳
        if: github.ref == 'refs/heads/main'
        run: ./publish_docker_with_args.sh ${{ steps.meta.outputs.version }}

  deploy:
    name: 배포
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 배포 파일 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            VERSION="${{ needs.test-and-build.outputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "Image version was not provided" >&2
              exit 1
            fi
            export APP_VERSION="$VERSION"
            docker compose pull
            docker compose up -d --remove-orphans
