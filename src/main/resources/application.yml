spring.application.name: rankademy

spring:
  config:
    import:
      - db.yml
      - jwt.yml
      - oauth2.yml
      - riot.yml
      - file.yml
      - url.yml
      - storage.yml
      - logging.yml
      - docker.yml
      - mail.yml
      - optional:file:.env[.properties]
  cache:
    cache-names: ddragonLatestVersion
    caffeine:
      spec: expireAfterWrite=1h