logging:
  file:
    path: ${LOG_PATH:logs} # 기본은 logs, LOG_PATH로 override 가능
  config: classpath:logback-spring.xml

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
    display-operation-id: true
    display-request-duration: true
  api-docs:
    path: /docs/api-docs

---
spring.config.activate.on-profile: default,local,dev,test

logging:
  level:
    maruhxn.rankademy: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring.config.activate.on-profile: prod

logging:
  level:
    root: info
    maruhxn.rankademy: info
