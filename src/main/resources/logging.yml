logging:
  file:
    path: logs # 로그 파일이 저장될 로그 디렉토리 경로
  config: classpath:logback-spring.xml

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
    display-operation-id: true
    display-request-duration: true
  api-docs:
    path: /docs/api-docs

---
spring.config.activate.on-profile: default,local,dev,test

logging:
  level:
    maruhxn.rankademy: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring.config.activate.on-profile: prod

logging:
  level:
    root: info
    maruhxn.rankademy: info
